steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--file=Dockerfile.backend'
      - '--tag=us-west1-docker.pkg.dev/$PROJECT_ID/trustmesh/backend:$_TAG'
      - '.'
    timeout: '600s'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/trustmesh/backend:$_TAG'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '900s'
