version: "3.9"

# 3-pod local demo (mirrors Cloud Run deployment)
# Usage:
#   docker compose build
#   docker compose up -d
#   # Wire pods together:
#   ./demo-3pod.sh wire

services:
  family:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9000:9000"
    environment:
      TRUSTMESH_POD_NAME: family
      TRUSTMESH_POD_URL: http://localhost:9000
      TRUSTMESH_REGISTRY_URL: http://registry:8100
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - family-data:/app/data

  hospital:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9001:9000"
    environment:
      TRUSTMESH_POD_NAME: hospital
      TRUSTMESH_POD_URL: http://localhost:9001
      TRUSTMESH_REGISTRY_URL: http://registry:8100
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - hospital-data:/app/data

  work:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9002:9000"
    environment:
      TRUSTMESH_POD_NAME: work
      TRUSTMESH_POD_URL: http://localhost:9002
      TRUSTMESH_REGISTRY_URL: http://registry:8100
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - work-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9000
    ports:
      - "3050:8080"
    depends_on:
      - family
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9000

  registry:
    build:
      context: .
      dockerfile: Dockerfile.registry
    ports:
      - "9100:8100"

volumes:
  family-data:
  hospital-data:
  work-data:
