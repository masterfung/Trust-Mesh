version: "3.9"

# 3-pod local demo (mirrors Cloud Run deployment)
# Usage:
#   export ANTHROPIC_API_KEY=...   # or GOOGLE_API_KEY=...
#   docker compose build
#   docker compose up -d
#   ./demo-3pod.sh wire            # wire pods together via federation

services:
  family:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9000:9000"
    environment:
      TRUSTMESH_POD_NAME: family
      TRUSTMESH_POD_URL: http://localhost:9000
      TRUSTMESH_REGISTRY_URL: http://registry:8100
      TRUSTMESH_DB: /data/trustmesh.db
      # SEED_POD_KEY not set → start.sh falls back to src.seed (full demo dataset)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Shared secret for pod-to-pod federation auth.
      # Use a real random value in production; this default is fine for local dev.
      TRUSTMESH_POOL_SYNC_SECRET: ${TRUSTMESH_POOL_SYNC_SECRET:-local-dev-secret-change-me}
    volumes:
      - family-data:/data

  hospital:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9001:9000"
    environment:
      TRUSTMESH_POD_NAME: hospital
      TRUSTMESH_POD_URL: http://localhost:9001
      TRUSTMESH_REGISTRY_URL: http://registry:8100
      TRUSTMESH_DB: /data/trustmesh.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TRUSTMESH_POOL_SYNC_SECRET: ${TRUSTMESH_POOL_SYNC_SECRET:-local-dev-secret-change-me}
    volumes:
      - hospital-data:/data

  work:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9002:9000"
    environment:
      TRUSTMESH_POD_NAME: work
      TRUSTMESH_POD_URL: http://localhost:9002
      TRUSTMESH_REGISTRY_URL: http://registry:8100
      TRUSTMESH_DB: /data/trustmesh.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TRUSTMESH_POOL_SYNC_SECRET: ${TRUSTMESH_POOL_SYNC_SECRET:-local-dev-secret-change-me}
    volumes:
      - work-data:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9000
    ports:
      - "3050:8080"
    depends_on:
      - family
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9000

  registry:
    build:
      context: .
      dockerfile: Dockerfile.registry
    ports:
      - "9100:8100"

volumes:
  family-data:
  hospital-data:
  work-data:
