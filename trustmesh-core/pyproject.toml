[project]
name = "trustmesh-core"
version = "0.1.0"
description = "Trust-aware knowledge sharing for AI agents"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.42.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "openai>=2.20.0",
    "resend>=2.21.0",
    "mcp>=1.26.0",
    "typer>=0.12.0",
]

[project.scripts]
trustmesh = "src.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
